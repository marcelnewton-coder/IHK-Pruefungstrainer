<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ec4899"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>IHK Lerncoach</title><style>
:root{--bg:#100d18;--card:#1d1829;--card2:#272033;--txt:#fff;--muted:#b9b2c8;--pink:#ec4899;--purple:#8b5cf6;--green:#22c55e;--red:#ef4444;--line:#3b314b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(160deg,#100d18,#1b1023 55%,#111827);color:var(--txt);min-height:100vh}.wrap{max-width:760px;margin:auto;padding:18px 16px 90px}.hero{display:flex;align-items:center;gap:14px;margin:8px 0 20px}.logo{width:76px;height:76px;border-radius:22px;box-shadow:0 8px 30px #ec489955}.hero h1{font-size:25px;margin:0}.hero p{margin:5px 0;color:var(--muted)}.card{background:#1d1829e8;border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 12px 35px #0004}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:15px;padding:14px 12px;font-weight:750;font-size:15px;color:white;background:var(--card2);cursor:pointer}.primary{background:linear-gradient(135deg,var(--pink),var(--purple))}.danger{background:#4a2028}.stat{font-size:28px;font-weight:800}.small{font-size:13px;color:var(--muted)}.bar{height:9px;background:#332a41;border-radius:9px;overflow:hidden;margin-top:8px}.fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--purple))}.qtitle{font-size:18px;font-weight:750;line-height:1.35}.choice{display:block;width:100%;text-align:left;margin:9px 0;background:#292237;border:1px solid #463a59;color:white;border-radius:14px;padding:13px}.choice.sel{border-color:#f472b6;background:#47233b}.answer{width:100%;min-height:105px;background:#15111e;color:white;border:1px solid #514261;border-radius:14px;padding:12px;font:inherit}.good{color:#86efac}.bad{color:#fca5a5}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#33263f;color:#f9a8d4;font-size:12px;margin-bottom:10px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.hidden{display:none}.feedback{margin-top:12px;padding:12px;border-radius:14px;background:#15111e;line-height:1.45}.nav{position:fixed;bottom:0;left:0;right:0;background:#15111ef2;border-top:1px solid #342b41;padding:9px;display:flex;justify-content:center;gap:8px}.nav button{max-width:180px;flex:1;font-size:12px;padding:10px 4px}.heart{font-size:22px;background:none;border:0}.topic{margin:12px 0}.notice{font-size:12px;color:#9f98ae;line-height:1.4}h2{margin:4px 0 12px;font-size:20px}@media(max-width:460px){.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:21px}.logo{width:66px;height:66px}}
</style></head><body><div class="wrap"><header class="hero"><img class="logo" src="icon-192.png"><div><h1>IHK Lerncoach</h1><p>Gesundheits- & Sozialwesen</p></div></header><main id="app"></main></div><nav class="nav"><button class="btn" onclick="home()">🏠 Start</button><button class="btn" onclick="stats()">📊 Statistik</button><button class="btn" onclick="start('weak')">🎯 Schwächen</button><button class="btn" onclick="start('wrong')">🔁 Fehler</button></nav><script>
const topics=['Betriebliche Prozesse','Qualitätsmanagement','Schnittstellen & Projekte','BWL & Ressourcen','Personal','Marketing'];
const Q=[
{id:1,t:0,k:'mc',q:'Welches Instrument eignet sich besonders, um Stärken, Schwächen, Chancen und Risiken einer Einrichtung strukturiert gegenüberzustellen?',o:['SWOT-Analyse','Organigramm','Break-even-Analyse','ABC-Analyse'],a:0,e:'Die SWOT-Analyse verbindet interne Stärken/Schwächen mit externen Chancen/Risiken.'},
{id:2,t:0,k:'text',q:'Nenne zwei typische Aufgaben des Prozessmanagements.',keys:['optim','ablauf','prozess','schnitt','qualität','effizienz'],need:2,e:'Mögliche Kernelemente: Prozesse erfassen/dokumentieren, Abläufe optimieren, Schnittstellen verbessern, Qualität und Effizienz sichern.'},
{id:3,t:0,k:'mc',q:'Was beschreibt ein Organigramm hauptsächlich?',o:['Aufbauorganisation und Zuständigkeiten','Liquiditätsplanung','Kundenzufriedenheit','Projektkosten'],a:0,e:'Ein Organigramm visualisiert Stellen, Hierarchien und organisatorische Zuordnungen.'},
{id:4,t:0,k:'text',q:'Warum sollten betriebliche Ziele möglichst messbar formuliert werden?',keys:['kontroll','mess','vergleich','zielerreich','überprüf'],need:1,e:'Messbare Ziele ermöglichen die Kontrolle bzw. Überprüfung der Zielerreichung.'},
{id:5,t:1,k:'mc',q:'Wofür steht der PDCA-Zyklus?',o:['Plan – Do – Check – Act','Prepare – Decide – Control – Assess','Plan – Develop – Calculate – Apply','Process – Do – Compare – Audit'],a:0,e:'PDCA bedeutet Planen, Umsetzen, Prüfen und Verbessern/Handeln.'},
{id:6,t:1,k:'text',q:'Nenne zwei mögliche Qualitätsdimensionen im Gesundheitswesen.',keys:['struktur','prozess','ergebnis'],need:2,e:'Klassisch werden Struktur-, Prozess- und Ergebnisqualität unterschieden.'},
{id:7,t:1,k:'mc',q:'Was ist ein zentrales Ziel eines internen Audits?',o:['Systematisch prüfen, ob Anforderungen und festgelegte Verfahren eingehalten werden','Werbung gestalten','Löhne berechnen','Neue Kunden akquirieren'],a:0,e:'Audits dienen der systematischen Überprüfung und liefern Ansatzpunkte für Verbesserungen.'},
{id:8,t:1,k:'text',q:'Was versteht man im Qualitätsmanagement unter einer kontinuierlichen Verbesserung?',keys:['ständig','kontinu','verbesser','regelmäßig','optim'],need:1,e:'Prozesse und Ergebnisse werden regelmäßig bewertet und schrittweise verbessert.'},
{id:9,t:2,k:'mc',q:'Was kennzeichnet ein Projekt am ehesten?',o:['Einmaliges Vorhaben mit Ziel, Zeit- und Ressourcenrahmen','Täglich identischer Routineprozess','Unbegrenzte Aufgabe ohne Ziel','Nur eine Besprechung'],a:0,e:'Projekte sind typischerweise zielgerichtet, zeitlich begrenzt und ressourcenbezogen.'},
{id:10,t:2,k:'text',q:'Nenne zwei typische Ursachen für Probleme an Schnittstellen.',keys:['kommun','information','zuständig','verantwort','abstimm','medienbruch'],need:2,e:'Häufig sind unklare Zuständigkeiten, Informationsverluste, Kommunikationsprobleme oder fehlende Abstimmung.'},
{id:11,t:2,k:'mc',q:'Welches Werkzeug zeigt Projektaufgaben entlang einer Zeitachse?',o:['Gantt-Diagramm','Bilanz','Organigramm','SWOT-Matrix'],a:0,e:'Ein Gantt-Diagramm stellt Vorgänge und Zeiträume eines Projekts grafisch dar.'},
{id:12,t:2,k:'text',q:'Warum ist eine klare Projektzieldefinition wichtig?',keys:['orient','mess','steuer','erfolg','ziel'],need:1,e:'Sie schafft Orientierung und ermöglicht Steuerung sowie spätere Erfolgskontrolle.'},
{id:13,t:3,k:'mc',q:'Was ist der Break-even-Point?',o:['Punkt, an dem Erlöse und Gesamtkosten gleich hoch sind','Höchster Lagerbestand','Zeitpunkt einer Kündigung','Maximale Patientenzahl'],a:0,e:'Am Break-even-Point ist das Ergebnis genau null: Erlöse entsprechen den Gesamtkosten.'},
{id:14,t:3,k:'text',q:'Nenne zwei Beispiele für fixe Kosten einer Einrichtung.',keys:['miete','abschreibung','versicherung','grundgebühr','gehalt'],need:2,e:'Beispiele können Miete, Abschreibungen, Versicherungen oder bestimmte feste Gehälter sein.'},
{id:15,t:3,k:'mc',q:'Welche Kennzahl beschreibt kurzfristig verfügbare Zahlungsmittel bzw. Zahlungsfähigkeit?',o:['Liquidität','Fluktuation','Reichweite','Marktanteil'],a:0,e:'Liquidität beschreibt die Fähigkeit, fällige Zahlungsverpflichtungen zu erfüllen.'},
{id:16,t:3,k:'text',q:'Ein Angebot bringt 12.000 € Erlös und verursacht 9.500 € Kosten. Wie hoch ist der Überschuss in Euro?',keys:['2500','2.500'],need:1,e:'12.000 € − 9.500 € = 2.500 €.'},
{id:17,t:4,k:'mc',q:'Welches Führungsverhalten fördert die Beteiligung von Mitarbeitenden an Entscheidungen?',o:['Kooperativer Führungsstil','Rein autoritärer Führungsstil','Keine Kommunikation','Vollständige Informationssperre'],a:0,e:'Kooperative Führung bezieht Mitarbeitende stärker in Entscheidungen ein.'},
{id:18,t:4,k:'text',q:'Nenne zwei Ziele eines Mitarbeitergesprächs.',keys:['feedback','ziel','entwick','motiv','leistung','konflikt'],need:2,e:'Beispiele: Feedback, Zielvereinbarung, Entwicklung, Motivation, Leistungsbesprechung oder Konfliktklärung.'},
{id:19,t:4,k:'mc',q:'Was ist eine typische Maßnahme der Personalentwicklung?',o:['Fort- und Weiterbildung','Preiserhöhung','Inventur','Werbekampagne'],a:0,e:'Fort- und Weiterbildung entwickelt Kompetenzen von Mitarbeitenden.'},
{id:20,t:4,k:'text',q:'Nenne zwei Maßnahmen, mit denen eine Führungskraft Mitarbeitende motivieren kann.',keys:['anerkenn','feedback','verantwort','weiterbild','beteilig','ziel','wertschätz'],need:2,e:'Zum Beispiel Anerkennung, konstruktives Feedback, Verantwortung, Beteiligung und Entwicklungsmöglichkeiten.'},
{id:21,t:5,k:'mc',q:'Was gehört zu den klassischen vier Instrumenten des Marketing-Mix?',o:['Produkt, Preis, Distribution und Kommunikation','Planung, Personal, Prüfung und Pflege','Kosten, Bilanz, Liquidität und Gewinn','Qualität, Audit, Prozess und Struktur'],a:0,e:'Die klassischen 4P sind Product, Price, Place und Promotion.'},
{id:22,t:5,k:'text',q:'Nenne zwei mögliche Ziele einer Marketingmaßnahme für eine Pflegeeinrichtung.',keys:['bekannt','kunde','patient','image','auslast','bindung','nachfrage'],need:2,e:'Beispiele: Bekanntheit erhöhen, Image stärken, Nachfrage/Auslastung steigern oder Kundenbindung verbessern.'},
{id:23,t:5,k:'mc',q:'Was bedeutet Zielgruppensegmentierung?',o:['Gesamtmarkt in relevante Kundengruppen aufteilen','Alle Kunden identisch behandeln','Nur Preise senken','Personal abbauen'],a:0,e:'Segmentierung teilt einen Markt nach geeigneten Merkmalen in Zielgruppen.'},
{id:24,t:5,k:'text',q:'Warum sollte der Erfolg einer Marketingkampagne anhand von Kennzahlen kontrolliert werden?',keys:['erfolg','wirksam','kontroll','ziel','optim','vergleich'],need:1,e:'Kennzahlen machen Zielerreichung und Wirksamkeit überprüfbar und unterstützen Optimierungen.'},
{id:25,t:1,k:'mc',q:'Eine Einrichtung registriert wiederholt ähnliche Beschwerden. Was ist im Sinne des QM besonders sinnvoll?',o:['Ursachen systematisch analysieren und Verbesserungsmaßnahmen ableiten','Beschwerden löschen','Nur die Mitarbeitenden tadeln','Nichts verändern'],a:0,e:'QM zielt auf systematische Ursachenanalyse und nachhaltige Verbesserungen.'},
{id:26,t:2,k:'text',q:'Fall: Bei der Entlassung fehlen der nachsorgenden Einrichtung regelmäßig wichtige Informationen. Nenne zwei sinnvolle Verbesserungsmaßnahmen.',keys:['standard','check','digital','übergabe','verantwort','schnitt','kommun','formular'],need:2,e:'Geeignet wären z. B. standardisierte Übergaben/Checklisten, klare Verantwortlichkeiten, definierte Informationswege oder digitale Übergabeprozesse.'},
{id:27,t:3,k:'mc',q:'Die variablen Kosten pro Leistung steigen bei unverändertem Preis. Was passiert grundsätzlich mit dem Deckungsbeitrag pro Leistung?',o:['Er sinkt','Er steigt','Er bleibt zwingend gleich','Er wird immer null'],a:0,e:'Deckungsbeitrag = Erlös minus variable Kosten. Steigen variable Kosten bei gleichem Erlös, sinkt er.'},
{id:28,t:4,k:'text',q:'Fall: In einem Team häufen sich Konflikte wegen unklarer Aufgabenverteilung. Wie sollte die Führungskraft vorgehen? Nenne zwei Schritte.',keys:['gespräch','klär','aufgab','zuständig','verantwort','moder','regel','kommun'],need:2,e:'Sinnvoll sind z. B. moderiertes Gespräch/Ursachenklärung und anschließend klare Aufgaben, Zuständigkeiten bzw. Regeln.'},
{id:29,t:0,k:'mc',q:'Welcher Begriff beschreibt die langfristige grundsätzliche Ausrichtung einer Organisation?',o:['Strategie','Tagesplan','Dienstübergabe','Einzelbeleg'],a:0,e:'Eine Strategie beschreibt die längerfristige Ausrichtung zur Erreichung übergeordneter Ziele.'},
{id:30,t:5,k:'text',q:'Nenne zwei Kriterien, nach denen eine Zielgruppe im Gesundheits- und Sozialwesen beschrieben werden kann.',keys:['alter','region','bedarf','einkomm','lebens','krank','demograf','sozial'],need:2,e:'Möglich sind z. B. Alter, Region, Bedarf, Lebenssituation, demografische oder soziale Merkmale.'}
];
let S=JSON.parse(localStorage.getItem('ihkCoachState')||'{"seen":{},"fav":[],"wrong":[],"sessions":0}');let round=[],idx=0,answers=[],mode='normal';const app=document.getElementById('app');function save(){localStorage.setItem('ihkCoachState',JSON.stringify(S))}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function topicStats(){return topics.map((_,t)=>{let s=0,c=0;Q.filter(q=>q.t===t).forEach(q=>{let x=S.seen[q.id];if(x){s+=x.ok;c+=x.n}});return {s,c,p:c?Math.round(s/c*100):0}})}function home(){let ts=topicStats(),all=Object.values(S.seen),n=all.reduce((a,x)=>a+x.n,0),ok=all.reduce((a,x)=>a+x.ok,0),p=n?Math.round(ok/n*100):0;app.innerHTML=`<section class="card"><div class="top"><div><div class="small">Gesamtfortschritt</div><div class="stat">${p}%</div></div><div style="text-align:right"><div class="small">Beantwortet</div><div class="stat">${n}</div></div></div><div class="bar"><div class="fill" style="width:${p}%"></div></div></section><section class="card"><h2>Was möchtest du trainieren?</h2><div class="grid"><button class="btn primary" onclick="start('normal')">🧠 5 Fragen lernen</button><button class="btn" onclick="start('weak')">🎯 Meine Schwächen</button><button class="btn" onclick="start('wrong')">🔁 Fehlertraining</button><button class="btn" onclick="start('fav')">❤️ Favoriten</button><button class="btn" onclick="exam()">⏱️ Prüfungssimulation</button><button class="btn" onclick="stats()">📊 Auswertung</button></div></section><section class="card"><h2>Deine Bereiche</h2>${ts.map((x,i)=>`<div class="topic"><div class="top"><span>${topics[i]}</span><b>${x.c?x.p+'%':'–'}</b></div><div class="bar"><div class="fill" style="width:${x.p}%"></div></div></div>`).join('')}</section><section class="card notice">Die Aufgaben dieser Lern-App sind selbst erstellte Übungsfragen und keine Original-IHK-Prüfungsaufgaben. Freitext wird anhand wichtiger Fachbegriffe automatisch bewertet; bei offenen Aufgaben solltest du zusätzlich die Musterlösung vergleichen.</section>`}
function poolFor(m){if(m==='wrong')return Q.filter(q=>S.wrong.includes(q.id));if(m==='fav')return Q.filter(q=>S.fav.includes(q.id));if(m==='weak'){let st=topicStats();let ranked=st.map((x,i)=>({i,p:x.c?x.p:-1})).sort((a,b)=>a.p-b.p);let weak=ranked.slice(0,3).map(x=>x.i);return Q.filter(q=>weak.includes(q.t))}return Q}
function start(m){mode=m;let p=poolFor(m);if(!p.length){app.innerHTML=`<section class="card"><h2>Noch nichts vorhanden</h2><p>Für diesen Modus brauchst du zunächst beantwortete bzw. markierte Fragen.</p><button class="btn primary" onclick="start('normal')">Jetzt lernen</button></section>`;return}round=shuffle(p).slice(0,Math.min(5,p.length));idx=0;answers=[];renderQ()}
function renderQ(){let q=round[idx],fav=S.fav.includes(q.id);app.innerHTML=`<section class="card"><div class="top"><span class="tag">${topics[q.t]}</span><button class="heart" onclick="fav(${q.id});renderQ()">${fav?'❤️':'🤍'}</button></div><div class="small">Frage ${idx+1} von ${round.length}</div><p class="qtitle">${q.q}</p>${q.k==='mc'?q.o.map((x,i)=>`<button class="choice" data-i="${i}" onclick="choose(this)">${String.fromCharCode(65+i)}. ${x}</button>`).join(''):`<textarea id="txt" class="answer" placeholder="Deine Antwort …"></textarea>`}<button class="btn primary" style="width:100%;margin-top:12px" onclick="check()">Antwort prüfen</button><div id="fb"></div></section>`}
let selected=null;function choose(el){selected=+el.dataset.i;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')}function norm(s){return s.toLowerCase().replace(/[.,€]/g,'').replace(/\s/g,'')}function check(){let q=round[idx],ok=false,user='';if(q.k==='mc'){if(selected===null)return alert('Bitte wähle eine Antwort.');ok=selected===q.a;user=selected}else{user=document.getElementById('txt').value.trim();if(!user)return alert('Bitte gib eine Antwort ein.');let n=norm(user),hits=q.keys.filter(k=>n.includes(norm(k))).length;ok=hits>=q.need}let x=S.seen[q.id]||{n:0,ok:0};x.n++;if(ok)x.ok++;S.seen[q.id]=x;if(!ok&&!S.wrong.includes(q.id))S.wrong.push(q.id);if(ok)S.wrong=S.wrong.filter(id=>id!==q.id);save();answers.push(ok);document.querySelectorAll('button.choice,textarea,#txt').forEach(e=>e.disabled=true);document.querySelector('.primary[onclick="check()"]')?.remove();document.getElementById('fb').innerHTML=`<div class="feedback"><b class="${ok?'good':'bad'}">${ok?'✓ Richtig':'✗ Noch nicht richtig'}</b><br>${q.e}</div><button class="btn primary" style="width:100%;margin-top:12px" onclick="next()">${idx===round.length-1?'Auswertung':'Nächste Frage →'}</button>`}
function next(){selected=null;if(++idx<round.length)renderQ();else result()}function result(){S.sessions++;save();let ok=answers.filter(Boolean).length,p=Math.round(ok/answers.length*100);app.innerHTML=`<section class="card" style="text-align:center"><div style="font-size:55px">${p>=80?'🌟':p>=50?'💪':'🎯'}</div><h2>Runde geschafft!</h2><div class="stat">${ok} / ${answers.length}</div><p>${p}% richtig</p><div class="grid"><button class="btn primary" onclick="start('${mode}')">Noch 5 Fragen</button><button class="btn" onclick="home()">Zur Übersicht</button></div></section>`}
function fav(id){S.fav.includes(id)?S.fav=S.fav.filter(x=>x!==id):S.fav.push(id);save()}function stats(){let ts=topicStats();app.innerHTML=`<section class="card"><h2>📊 Lernstatistik</h2>${ts.map((x,i)=>`<div class="topic"><div class="top"><span>${topics[i]}</span><b>${x.c?x.p+'%':'Noch offen'}</b></div><div class="small">${x.c} Antworten</div><div class="bar"><div class="fill" style="width:${x.p}%"></div></div></div>`).join('')}</section><section class="card"><div class="grid"><div><div class="small">Fehlerfragen</div><div class="stat">${S.wrong.length}</div></div><div><div class="small">Favoriten</div><div class="stat">${S.fav.length}</div></div></div><button class="btn danger" style="width:100%;margin-top:18px" onclick="resetAll()">Lernfortschritt zurücksetzen</button></section>`}function resetAll(){if(confirm('Wirklich alle Lernstatistiken löschen?')){S={seen:{},fav:[],wrong:[],sessions:0};save();home()}}function exam(){mode='normal';round=shuffle(Q).slice(0,10);idx=0;answers=[];renderQ()}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');home();
</script></body></html>
